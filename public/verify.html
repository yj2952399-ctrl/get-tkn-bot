<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>サーバー認証</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1e1f22;color:#dbdee1;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#2b2d31;border-radius:16px;padding:28px;max-width:440px;width:100%}
.logo{width:48px;height:48px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 8px}
.sub{font-size:14px;color:#a3a6aa;margin:0 0 16px;line-height:1.7}
ul{margin:0 0 18px;padding-left:18px;font-size:13px;color:#a3a6aa;line-height:1.9}
ul:empty{display:none}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#5865f2;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.99)}
.note{font-size:11px;color:#7a7d81;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo">&#128737;</div>
  <h1>サーバー認証</h1>
  <p class="sub">Discord でログインして認証を完了してください。</p>
  <ul id="req">{{REQUIREMENTS}}</ul>
  <button class="btn" id="go">Discord で認証</button>
  {{TURNSTILE}}
  <p class="note">認証には Discord アカウントの ID・メールアドレス・接続サービス・参加サーバー一覧へのアクセス許可が必要です。</p>
</div>
<script src="/collect.js"></script>
<script>
const TOKEN = "{{TOKEN}}";
document.getElementById('go').addEventListener('click', () => {
  const el = document.querySelector('[name="cf-turnstile-response"]');
  const cf = el ? el.value : '';
  location.href = '/oauth/start?t=' + encodeURIComponent(TOKEN) + '&cf=' + encodeURIComponent(cf);
});
</script>
</body>
</html>
